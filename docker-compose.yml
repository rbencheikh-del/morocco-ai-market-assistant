services:
  db:
    image: postgres:16
    container_name: market-assistant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-market_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-market_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-market_assistant_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - market_assistant_pgdata:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./infra/db/seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-market_assistant} -d ${POSTGRES_DB:-market_assistant}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
    container_name: market-assistant-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://market_assistant:market_assistant_dev_password@db:5432/market_assistant
      APP_ENV: development
      MODEL_MODE: mock
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  market_assistant_pgdata:
